spring:
  profiles:
    active: dev

# 将所有数字转为 String 类型返回，避免前端数据精度丢失的问题
  jackson:
    generator:
      write-numbers-as-strings: true
  servlet:
    # 上传文件最大大小
    multipart:
      max-file-size: 5MB

server:
  port: 8888

---
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/novel_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: test123456
  config:
    activate:
      on-profile: dev

---
spring:
  # Redis 配置
  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456
  config:
    activate:
      on-profile: dev
  # Elasticsearch 配置
  elasticsearch:
    # 是否开启 elasticsearch 搜索引擎功能：true-开启 false-不开启
    enable: false
    uris:
      - https://my-deployment-ce7ca3.es.us-central1.gcp.cloud.es.io:9243
    username: elastic
    password: qTjgYVKSuExX6tWAsDuvuvwl
  amqp:
    # 是否开启 Spring AMQP：true-开启 false-不开启
    enable: false
  # RabbitMQ 配置
  rabbitmq:
    addresses: "amqp://guest:guest@47.106.243.172"
    virtual-host: novel
    template:
      retry:
        # 开启重试
        enabled: true
        # 最大重试次数
        max-attempts: 3
        # 第一次和第二次重试之间的持续时间
        initial-interval: "3s"

---
spring:
  config:
    activate:
      on-profile: dev

# 项目配置
novel:
  # 跨域配置
  cors:
    # 允许跨域的域名
    allow-origins:
      - http://localhost:1024
      - http://localhost:8080
  # JWT密钥
  jwt:
    secret: E66559580A1ADF48CDD928516062F12E
  # XSS 过滤配置
  xss:
    # 过滤开关
    enabled: true
    # 排除链接
    excludes:
      - /system/notice/*
  file:
    # 文件上传配置
    upload:
      # 上传路径
      path: /Users/xiongxiaoyang/upload
  # 财务配置
  finance:
    # 默认章节价格（屋币）
    default-chapter-price: 10
    # 税率百分比，如 20 表示 20%
    tax-rate: 20
    # 退款窗口时长（小时）
    refund-window-hours: 72
    # 会员折扣差价中平台补贴比例（%）
    membership-subsidy-rate: 50
    # 基础会员每月免费章节配额
    basic-member-free-quota: 5
    # 高级会员每月免费章节配额
    premium-member-free-quota: 20
    # 至尊会员每月免费章节配额
    supreme-member-free-quota: 100
    # 基础会员折扣（90=九折）
    basic-member-discount: 90
    # 高级会员折扣
    premium-member-discount: 80
    # 至尊会员折扣
    supreme-member-discount: 60
    # 基础会员赠送阅读券数量
    basic-member-voucher-count: 1
    # 高级会员赠送阅读券数量
    premium-member-voucher-count: 3
    # 至尊会员赠送阅读券数量
    supreme-member-voucher-count: 10
    # 阅读券有效天数
    voucher-valid-days: 30



